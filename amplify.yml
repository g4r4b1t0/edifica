# Amplify Hosting: sitio estático sin build.
# Los custom HTTP headers van en customHttp.yml (raíz del repo), no en este buildspec.
# REEMPLAZAR: al crear /obras/ con fotos reales, agregar obras/**/* a artifacts.files para que se publique.
version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Sitio estatico, sin proceso de build"
  artifacts:
    baseDirectory: /
    files:
      - index.html
      - cotizar/**/*
      - assets/**/*
      - robots.txt
      - og.jpg
      - favicon.ico
      - sitemap.xml
