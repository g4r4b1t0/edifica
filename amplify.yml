# Amplify Hosting: sitio estático sin build.
# Los custom HTTP headers van en customHttp.yml (raíz del repo), no en este buildspec.
# REEMPLAZAR: al crear og.jpg y /obras/ con fotos reales, agregarlas a artifacts.files
# (og.jpg y obras/**/*) para que se publiquen.
version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Sitio estatico, sin proceso de build"
  artifacts:
    baseDirectory: /
    files:
      - index.html
      - cotizar/**/*
      - assets/**/*
      - robots.txt
      - sitemap.xml
